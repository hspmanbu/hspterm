[package]
name = "hspterm-storage-sync"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hspterm-term-core = { path = "../term-core" }
aes-gcm.workspace = true
aes.workspace = true
argon2.workspace = true
rand.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
tempfile.workspace = true
fs2 = "0.4"
encoding_rs = { version = "0.8.42", default-features = false, features = ["alloc"] }
tokio.workspace = true
tokio-util.workspace = true
# Static batch: resolve/update Cargo.lock only in the final unified build stage.
# rustls-no-provider + explicit ring avoids pulling a second crypto C toolchain.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }
